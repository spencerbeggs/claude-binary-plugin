# =============================================================================
# Prometheus - Local Development Configuration
# =============================================================================
# Scrapes the OTel Collector's Prometheus exporter for application metrics.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # OTel Collector application metrics (from plugin telemetry)
  - job_name: "otel-collector-app"
    scrape_interval: 15s
    static_configs:
      - targets: ["otel-collector:8889"]

  # OTel Collector internal metrics (self-monitoring)
  - job_name: "otel-collector-internal"
    scrape_interval: 30s
    static_configs:
      - targets: ["otel-collector:8888"]

  # Prometheus self-monitoring
  - job_name: "prometheus"
    scrape_interval: 30s
    static_configs:
      - targets: ["localhost:9090"]
